<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1c2330; --muted: #667085;
    --border: #dfe3ea; --accent: #2f6fed; --accent-text: #ffffff; --danger: #c93434;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1d2128; --text: #e7eaf0; --muted: #98a2b3;
      --border: #313742; --accent: #5b8ff5; --accent-text: #0e1116; --danger: #f07070;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 1000px; margin: 0 auto; padding: 20px 16px 4px;
  }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  main {
    max-width: 1000px; margin: 0 auto; padding: 16px;
    display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .wide { grid-column: 1 / -1; }
  #login { max-width: 340px; margin: 12vh auto 0; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  form.stack { flex-direction: column; align-items: stretch; }
  form.stack label { flex: none; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); flex: 1 1 130px; }
  input, select, button {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; min-width: 0;
  }
  button { background: var(--accent); color: var(--accent-text); border-color: var(--accent); cursor: pointer; }
  button.plain { background: none; color: var(--muted); border-color: var(--border); }
  button.delete { background: none; color: var(--danger); border: none; padding: 2px 6px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .big { font-size: 28px; font-weight: 600; margin-top: 12px; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); text-align: center; padding: 18px 8px; }
  #message { min-height: 22px; margin: 0 auto; max-width: 1000px; padding: 0 16px; color: var(--danger); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<section id="login" class="card" hidden>
  <h1>Expense Tracker</h1>
  <p id="login-error" style="color: var(--danger); min-height: 22px; margin: 8px 0"></p>
  <form id="login-form" class="stack">
    <label>Username <input name="username" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button>Log in</button>
  </form>
</section>

<div id="app" hidden>
  <header>
    <h1>Expense Tracker</h1>
    <button id="logout" class="plain">Log out</button>
  </header>
  <p id="message" role="alert"></p>

  <main>
    <section class="card">
      <h2>Add expense</h2>
      <form id="expense-form">
        <label>Category <select name="category_id" class="category-select" required></select></label>
        <label>Amount <input name="amount" type="number" step="0.01" min="0.01" required></label>
        <label>Date <input name="date" type="date" required></label>
        <label style="flex-basis: 100%">Description <input name="description" required></label>
        <button>Add expense</button>
      </form>
    </section>

    <section class="card">
      <h2>Add category</h2>
      <form id="category-form">
        <label>Name <input name="name" required></label>
        <button>Add category</button>
      </form>
      <h2 style="margin-top: 20px">Monthly total</h2>
      <form id="month-form">
        <label>Month <input name="month" type="month" required></label>
      </form>
      <div id="monthly-total" class="big"></div>
    </section>

    <section class="card wide">
      <h2>Expenses</h2>
      <form id="filter-form">
        <label>Show
          <select name="mode">
            <option value="all">All expenses</option>
            <option value="category">One category</option>
            <option value="range">Date range</option>
          </select>
        </label>
        <label data-mode="category" hidden>Category <select name="category"></select></label>
        <label data-mode="range" hidden>From <input name="start" type="date"></label>
        <label data-mode="range" hidden>To <input name="end" type="date"></label>
      </form>
      <div class="scroll">
        <table>
          <thead><tr><th>Date</th><th>Category</th><th>Description</th><th class="num">Amount</th><th></th></tr></thead>
          <tbody id="expenses"></tbody>
        </table>
      </div>
    </section>

    <section class="card wide">
      <h2>Spending by category</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>Category</th><th class="num">Expenses</th><th class="num">Total</th></tr></thead>
          <tbody id="totals"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
const money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
const today = () => {
  const d = new Date();
  return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
};

const filterForm = $("filter-form");
const monthForm = $("month-form");

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401 && path !== "/login") {
    showLogin();
    throw new Error("Please log in.");
  }
  const data = res.status === 204 ? null : await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// Run an action, showing any error in the page's message line.
async function attempt(action) {
  $("message").textContent = "";
  try {
    await action();
  } catch (err) {
    $("message").textContent = err.message;
  }
}

function showLogin() {
  $("app").hidden = true;
  $("login").hidden = false;
}

function cell(text, className) {
  const td = document.createElement("td");
  td.textContent = text;
  if (className) td.className = className;
  return td;
}

function fillRows(tbody, rows, columns, emptyText) {
  tbody.replaceChildren(...rows);
  if (!rows.length) {
    const td = cell(emptyText, "empty");
    td.colSpan = columns;
    tbody.append(document.createElement("tr"));
    tbody.lastChild.append(td);
  }
}

async function loadCategories() {
  const categories = await api("GET", "/categories");
  const idSelect = document.querySelector(".category-select");
  const nameSelect = filterForm.category;
  const selectedId = idSelect.value, selectedName = nameSelect.value;
  idSelect.replaceChildren(...categories.map((c) => new Option(c.name, c.id)));
  nameSelect.replaceChildren(...categories.map((c) => new Option(c.name, c.name)));
  if (selectedId) idSelect.value = selectedId;
  if (selectedName) nameSelect.value = selectedName;
}

async function loadExpenses() {
  const { mode, category, start, end } = filterForm;
  let path = "/expenses";
  if (mode.value === "category") {
    if (!category.value) return;
    path = "/expenses/by-category?" + new URLSearchParams({ name: category.value });
  } else if (mode.value === "range") {
    if (!start.value || !end.value) return;
    path = "/expenses/by-date-range?" + new URLSearchParams({ start: start.value, end: end.value });
  }
  const expenses = await api("GET", path);
  const rows = expenses.map((e) => {
    const tr = document.createElement("tr");
    const remove = document.createElement("button");
    remove.textContent = "Delete";
    remove.className = "delete";
    remove.onclick = () => attempt(async () => {
      if (!confirm(`Delete "${e.description}"?`)) return;
      await api("DELETE", `/expenses/${e.id}`);
      await refreshData();
    });
    const actions = cell("", "num");
    actions.append(remove);
    // The by-category endpoint omits the category name, so use the filter's.
    tr.append(
      cell(e.date), cell(e.category ?? category.value), cell(e.description),
      cell(money.format(e.amount), "num"), actions,
    );
    return tr;
  });
  fillRows($("expenses"), rows, 5, "No expenses to show.");
}

async function loadTotals() {
  const totals = await api("GET", "/expenses/totals-by-category");
  const rows = totals.map((t) => {
    const tr = document.createElement("tr");
    tr.append(cell(t.category), cell(t.num_expenses, "num"), cell(money.format(t.total_spent ?? 0), "num"));
    return tr;
  });
  fillRows($("totals"), rows, 3, "No categories yet.");
}

async function loadMonthlyTotal() {
  if (!monthForm.month.value) return;
  const data = await api("GET", "/expenses/monthly-total?" + new URLSearchParams({ month: monthForm.month.value }));
  $("monthly-total").textContent = money.format(data.monthly_total ?? 0);
}

const refreshData = () => Promise.all([loadExpenses(), loadTotals(), loadMonthlyTotal()]);

async function start() {
  await loadCategories();
  $("login").hidden = true;
  $("app").hidden = false;
  await refreshData();
}

$("login-form").onsubmit = async (event) => {
  event.preventDefault();
  const form = event.target;
  $("login-error").textContent = "";
  try {
    await api("POST", "/login", { username: form.username.value, password: form.password.value });
    form.reset();
    await start();
  } catch (err) {
    $("login-error").textContent = err.message;
  }
};

$("logout").onclick = () => attempt(async () => {
  await api("POST", "/logout");
  showLogin();
});

$("category-form").onsubmit = (event) => {
  event.preventDefault();
  const form = event.target;
  attempt(async () => {
    await api("POST", "/categories", { name: form.name.value.trim() });
    form.reset();
    await Promise.all([loadCategories(), loadTotals()]);
  });
};

$("expense-form").onsubmit = (event) => {
  event.preventDefault();
  const form = event.target;
  attempt(async () => {
    await api("POST", "/expenses", {
      category_id: Number(form.category_id.value),
      amount: form.amount.value,
      description: form.description.value.trim(),
      date: form.date.value,
    });
    form.amount.value = "";
    form.description.value = "";
    await refreshData();
  });
};

filterForm.onsubmit = (event) => event.preventDefault();
filterForm.onchange = () => {
  for (const label of filterForm.querySelectorAll("[data-mode]")) {
    label.hidden = label.dataset.mode !== filterForm.mode.value;
  }
  attempt(loadExpenses);
};

monthForm.onsubmit = (event) => event.preventDefault();
monthForm.onchange = () => attempt(loadMonthlyTotal);

$("expense-form").date.value = today();
monthForm.month.value = today().slice(0, 7);
// Loading the categories doubles as the "am I logged in?" check.
start().catch((err) => {
  if ($("login").hidden) {
    $("app").hidden = false;
    $("message").textContent = err.message;
  }
});
</script>
</body>
</html>
